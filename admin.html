<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - Hội Thao Liwayway 2026</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans py-10">

    <!-- BƯỚC 1: ĐĂNG NHẬP -->
    <div id="adminLoginView" class="w-full max-w-sm mx-auto px-4 mt-12">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 space-y-4">
            <div class="text-center">
                <span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Hội Thao Liwayway 2026</span>
                <h2 class="text-2xl font-black text-slate-900 mt-2">🔒 Đăng nhập Admin</h2>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu quản trị *</label>
                <input type="password" id="adminPasswordInput" placeholder="Mật khẩu ban đầu: Hoadaquy" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-900 outline-none">
            </div>
            <button onclick="handleAdminLogin()" id="loginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl transition cursor-pointer">Xác nhận</button>
            <div class="text-center pt-2">
                <a href="index.html" class="text-xs text-slate-500 hover:underline">← Về trang đăng ký công khai</a>
            </div>
        </div>
    </div>

    <!-- BƯỚC 2: DASHBOARD QUẢN TRỊ (MẶC ĐỊNH ẨN) -->
    <div id="adminDashboardView" class="hidden w-full max-w-4xl mx-auto px-4">
        <header class="mb-6 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h1 class="text-2xl font-black text-slate-900">📊 Hệ Thống Quản Trị Trung Tâm</h1>
                <p class="text-slate-500 text-sm mt-0.5">Quản lý thời gian, mật khẩu và xem báo cáo dữ liệu trực tiếp</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer self-start sm:self-center">
                🚪 Đăng xuất
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- CẤU HÌNH HỆ THỐNG -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 h-fit">
                <h3 class="font-bold text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-1.5">⚙️ Cấu hình</h3>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Hạn đóng khóa đăng ký</label>
                        <input type="datetime-local" id="configDeadline" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Đổi mật khẩu quản trị mới</label>
                        <input type="password" id="configPassword" placeholder="Bỏ trống nếu giữ nguyên" class="w-full px-3 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="saveSystemConfig()" id="btnSaveConfig" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-lg transition cursor-pointer shadow-sm">Lưu Thay Đổi</button>
                </div>
            </div>

            <!-- DASHBOARD THỐNG KÊ -->
            <div class="md:col-span-2 space-y-6">
                <!-- Số liệu nhanh -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gradient-to-br from-indigo-600 to-blue-600 text-white p-5 rounded-2xl shadow-sm">
                        <span class="text-xs opacity-80 block font-medium uppercase tracking-wider">Người thân cổ vũ</span>
                        <span id="statTotalRelatives" class="text-4xl font-black block mt-1">0</span>
                    </div>
                    <div class="bg-gradient-to-br from-emerald-600 to-teal-600 text-white p-5 rounded-2xl shadow-sm">
                        <span class="text-xs opacity-80 block font-medium uppercase tracking-wider">VĐV Đã Bảo Lãnh</span>
                        <span id="statTotalAthletes" class="text-4xl font-black block mt-1">0</span>
                    </div>
                </div>

                <!-- Thống kê Bộ phận -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-900 border-b border-slate-100 pb-3 mb-3 flex items-center gap-1.5">🏢 Số lượng đăng ký theo bộ phận</h3>
                    <div id="deptStatsContainer" class="space-y-2 text-sm divide-y divide-slate-100">
                        <!-- Nội dung render động -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // THAY LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQ_E3CP4x0j8t4EGfSws34cn4vN5y4qsfibUGTpE2zvutdj2biQdCyfw2EW2QopxP8sg/exec';
        
        let currentAdminPassword = '';

        function handleAdminLogin() {
            const pwd = document.getElementById('adminPasswordInput').value.trim();
            if(!pwd) { alert('Vui lòng điền mật khẩu!'); return; }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true; loginBtn.innerText = 'Đang kiểm tra bảo mật...';

            fetch(`${SCRIPT_URL}?action=adminLogin&password=${encodeURIComponent(pwd)}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        currentAdminPassword = pwd;
                        document.getElementById('configDeadline').value = data.deadline;
                        document.getElementById('statTotalRelatives').innerText = data.stats.totalRelatives;
                        document.getElementById('statTotalAthletes').innerText = data.stats.totalAthletes;
                        
                        const container = document.getElementById('deptStatsContainer');
                        container.innerHTML = '';
                        if (Object.keys(data.stats.deptStats).length === 0) {
                            container.innerHTML = `<p class="text-slate-400 italic py-4 text-center">Chưa có dữ liệu người thân đăng ký.</p>`;
                        } else {
                            for (const [dept, count] of Object.entries(data.stats.deptStats)) {
                                container.innerHTML += `<div class="flex justify-between py-3 items-center">
                                    <span class="font-semibold text-slate-700">${dept}</span>
                                    <span class="bg-slate-100 text-slate-800 font-bold px-3 py-1 rounded-xl text-xs">${count} người thân</span>
                                </div>`;
                            }
                        }
                        document.getElementById('adminLoginView').classList.add('hidden');
                        document.getElementById('adminDashboardView').classList.remove('hidden');
                    } else {
                        alert(data.message);
                    }
                })
                .catch(() => alert('Lỗi đồng bộ dữ liệu với Google Sheets!'))
                .finally(() => { loginBtn.disabled = false; loginBtn.innerText = 'Xác nhận'; });
        }

        function saveSystemConfig() {
            const newDeadline = document.getElementById('configDeadline').value;
            const newPassword = document.getElementById('configPassword').value.trim();
            const btn = document.getElementById('btnSaveConfig');

            btn.disabled = true; btn.innerText = 'Đang ghi nhận...';

            fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'updateConfig', adminPassword: currentAdminPassword, newDeadline: newDeadline, newPassword: newPassword })
            })
            .then(() => {
                alert('Cập nhật thành công! Hệ thống Sheets đã đồng bộ cấu hình mới.');
                if(newPassword) currentAdminPassword = newPassword;
                document.getElementById('configPassword').value = '';
            })
            .catch(() => alert('Lỗi lưu cấu hình hệ thống!'))
            .finally(() => { btn.disabled = false; btn.innerText = 'Lưu Thay Đổi'; });
        }

        function logoutAdmin() {
            currentAdminPassword = '';
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminDashboardView').classList.add('hidden');
            document.getElementById('adminLoginView').classList.remove('hidden');
        }
    </script>
</body>
</html>
